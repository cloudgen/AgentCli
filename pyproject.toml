[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AgentCli"
version = "1.2.0"
description = "AgentCli installs and runs xAI grok, and backs up its auth files."
readme = "README.md"
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
license = {text = "MIT"}
authors = [
    {name = "cloudgen", email = "wongcf22@gmail.com"}
]
keywords = ["CLI", "TUI", "grok"]

dependencies = [
    "ChronicleLogger>=1.3.1",
]

# Official project links (this is what shows on PyPI!)
[project.urls]
Homepage = "https://github.com/cloudgen/AgentCli"
Repository = "https://github.com/cloudgen/AgentCli"
Issues = "https://github.com/cloudgen/AgentCli/issues"

# This makes `agent-cli` available after pip install
[project.scripts]
agent-cli = "AgentCli.cli:main"